name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mobile_installment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mobile_installment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mobile_installment?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      NATIONAL_ID_ENCRYPTION_KEY: ci-national-id-encryption-key-32ch-min
      KYC_STORAGE_ROOT: ./storage/kyc
      OCR_PROVIDER: sandbox
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-32chars-min
      PAYMENT_PROVIDER: sandbox
      CUSTOMER_OTP_SANDBOX_CODE: "123456"
      MERCHANT_WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @mip/backend exec prisma migrate deploy
      - run: pnpm --filter @mip/backend typecheck
      - run: pnpm --filter @mip/backend test
      - run: pnpm --filter @mip/backend test:e2e

  merchant-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @mip/merchant-web typecheck
      - run: pnpm --filter @mip/merchant-web test

  customer-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/customer-mobile
      - run: flutter test
        working-directory: apps/customer-mobile
